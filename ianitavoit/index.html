<script>
(function(){
  var r=document.documentElement;
  function paint(){var c=r.dataset.theme||'';
    document.querySelectorAll('.tint button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.t===c));});}
  document.querySelectorAll('.tint button').forEach(function(b){
    b.addEventListener('click',function(){
      var v=b.dataset.t; if(v){r.dataset.theme=v}else{delete r.dataset.theme}
      try{localStorage.setItem('theme',v)}catch(e){} paint();});});
  paint();
})();
</script>
